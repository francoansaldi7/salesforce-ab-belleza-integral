<!--
  Tarjeta de imagen para Salon_Product__c: muestra la foto del producto y permite
  subir o reemplazarla directamente desde la página del registro.
-->
<template>
    <article class="ab-card product-image-card">

        <header class="card-header">
            <span class="header-icon-wrap"><lightning-icon icon-name="utility:image" size="x-small" class="header-icon"></lightning-icon></span>
            <h2 class="card-title">Imagen del producto</h2>
        </header>

        <!-- Tres estados: cargando, con imagen, sin imagen -->
        <div class="image-area">
            <template lwc:if={isLoading}>
                <div class="placeholder">
                    <div class="ab-loader" role="status" aria-label="Cargando imagen"></div>
                </div>
            </template>
            <template lwc:elseif={imageUrl}>
                <div class="image-frame">
                    <img class="product-img" src={imageUrl} alt="Imagen del producto" />
                </div>
            </template>
            <template lwc:else>
                <div class="placeholder placeholder--empty">
                    <span class="placeholder-icon-wrap"><lightning-icon icon-name="utility:image" size="small" class="placeholder-icon"></lightning-icon></span>
                    <p class="placeholder-text">Sin imagen</p>
                    <p class="placeholder-hint">Subí una foto para reconocer el producto de un vistazo.</p>
                </div>
            </template>
        </div>

        <!-- record-id vincula el archivo al producto. Sin el atributo `multiple` se sube un archivo a la vez
             (multiple="false" pasaría el texto "false", que cuenta como verdadero, y permitiría varios). -->
        <div class="upload-area">
            <lightning-file-upload
                label="Subir imagen"
                name="productImage"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}
                class="uploader">
            </lightning-file-upload>
            <p class="upload-hint">JPG, PNG, GIF, WEBP o BMP. La imagen anterior se conserva en los archivos del producto.</p>
        </div>

    </article>
</template>
