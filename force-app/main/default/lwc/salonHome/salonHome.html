<!--
  Panel de Control de AB Belleza Integral: citas del día / próximas, indicadores,
  acciones rápidas (asistentes) y detalles de balance, stock y clientes inactivos.
-->
<template>
    <div class="salon-home">

        <!-- Encabezado -->
        <header class="salon-header">
            <div class="monogram" aria-hidden="true">AB</div>
            <div class="header-text">
                <div class="salon-header__title">AB Belleza Integral</div>
                <div class="salon-header__subtitle">Panel de control · {today}</div>
            </div>
        </header>

        <!-- Indicadores -->
        <div class="kpi-grid">
            <div class="kpi-tile-wrap">
                <button class="kpi-tile kpi-income kpi-tile--clickable" onclick={handleBalanceTileClick} title="Ver historial de balances">
                    <span class="kpi-icon"><lightning-icon icon-name="utility:moneybag" size="x-small"></lightning-icon></span>
                    <span class="kpi-tile__label">Balance mensual</span>
                    <span class="kpi-tile__value">
                        <template lwc:if={isLoadingKpis}><span class="ab-skeleton" aria-label="Cargando"></span></template>
                        <template lwc:else><span class={monthlyBalanceClass}>{monthlyBalanceFormatted}</span></template>
                    </span>
                    <span class="kpi-tile__hint">Ver historial ›</span>
                </button>
                <button class="kpi-chart-btn" onclick={handleBalanceChartClick} title="Ver gráfico de ingresos y gastos"
                    aria-label="Ver gráfico de ingresos y gastos">
                    <lightning-icon icon-name="utility:chart" size="x-small"></lightning-icon>
                </button>
            </div>

            <div class="kpi-tile kpi-appointments">
                <span class="kpi-icon"><lightning-icon icon-name="utility:event" size="x-small"></lightning-icon></span>
                <span class="kpi-tile__label">Citas abiertas</span>
                <span class="kpi-tile__value">
                    <template lwc:if={isLoadingKpis}><span class="ab-skeleton" aria-label="Cargando"></span></template>
                    <template lwc:else>{openAppointmentsCount}</template>
                </span>
                <span class="kpi-tile__hint kpi-tile__hint--static">Desde hoy</span>
            </div>

            <button class="kpi-tile kpi-stock kpi-tile--clickable" onclick={handleLowStockClick} title="Ver productos con bajo stock">
                <span class="kpi-icon kpi-icon--warn"><lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon></span>
                <span class="kpi-tile__label">Bajo stock</span>
                <span class="kpi-tile__value">
                    <template lwc:if={isLoadingKpis}><span class="ab-skeleton" aria-label="Cargando"></span></template>
                    <template lwc:else>{lowStockCount}</template>
                </span>
                <span class="kpi-tile__hint">Ver detalle ›</span>
            </button>

            <button class="kpi-tile kpi-dormant kpi-tile--clickable" onclick={handleDormantClick} title="Ver clientes inactivos">
                <span class="kpi-icon"><lightning-icon icon-name="utility:people" size="x-small"></lightning-icon></span>
                <span class="kpi-tile__label">Clientes inactivos</span>
                <span class="kpi-tile__value">
                    <template lwc:if={isLoadingKpis}><span class="ab-skeleton" aria-label="Cargando"></span></template>
                    <template lwc:else>{dormantClientsCount}</template>
                </span>
                <span class="kpi-tile__hint">Ver detalle ›</span>
            </button>
        </div>

        <!-- Acciones rápidas -->
        <div class="quick-actions">
            <button class="ab-btn action-btn action-new-appointment" onclick={openNewAppointmentFlow}>+ Nueva cita</button>
            <button class="ab-btn ab-btn--ghost action-btn action-expense" onclick={openExpenseFlow}>+ Registrar gasto</button>
            <button class="ab-btn ab-btn--ghost action-btn action-sale" onclick={openProductSaleFlow}>+ Vender producto</button>
            <button class="ab-btn ab-btn--ghost action-btn action-history" onclick={handleOpenHistory}>
                <lightning-icon icon-name="utility:clock" size="xx-small" class="action-icon"></lightning-icon>
                Historial de citas
            </button>
        </div>

        <!-- Asistente (flow) -->
        <template lwc:if={showFlow}>
            <div class="ab-modal-overlay">
                <section class="ab-modal flow-container" role="dialog" aria-modal="true">
                    <div class="ab-modal__header flow-header">
                        <h2 class="ab-modal__title flow-header__title">{activeFlowLabel}</h2>
                        <button class="ab-modal__close" onclick={closeFlow} aria-label="Cerrar">&#215;</button>
                    </div>
                    <div class="ab-modal__body">
                        <lightning-flow flow-api-name={activeFlowName} onstatuschange={handleFlowStatusChange}></lightning-flow>
                    </div>
                </section>
            </div>
        </template>

        <!-- Citas -->
        <section class="content-panel">
            <div class="panel-header">
                <h2 class="panel-header__title">{panelTitle}</h2>
                <span class="panel-header__count">{appointmentCount}</span>
                <div class="view-toggle" role="group" aria-label="Vista de citas">
                    <button class={todayBtnClass} onclick={handleViewToggle} data-view="today">Hoy</button>
                    <button class={pendingBtnClass} onclick={handleViewToggle} data-view="pending">Próximas</button>
                </div>
            </div>

            <template lwc:if={isLoadingAppointments}>
                <div class="ab-loader-wrap"><div class="ab-loader" role="status" aria-label="Cargando citas"></div></div>
            </template>

            <template lwc:elseif={hasAppointments}>
                <ul class="appointment-list">
                    <template for:each={activeAppointments} for:item="appt">
                        <li key={appt.Id} class="appointment-item" data-id={appt.Id} onclick={handleAppointmentClick}>
                            <div class="appt-time">{appt.displayLabel}</div>
                            <div class="appt-avatar" aria-hidden="true">{appt.initials}</div>
                            <div class="appt-info">
                                <div class="appt-client">
                                    {appt.Client__r.Full_Name__c}
                                    <template lwc:if={appt.Client__r.VIP_Client__c}>
                                        <span class="badge badge-vip">VIP</span>
                                    </template>
                                    <template lwc:if={appt.Client__r.Allergies_Notes__c}>
                                        <span class="badge badge-allergy" title={appt.Client__r.Allergies_Notes__c}>ALERGIA</span>
                                    </template>
                                </div>
                                <div class="appt-services">
                                    <template for:each={appt.services} for:item="service">
                                        <span key={service} class="service-tag">{service}</span>
                                    </template>
                                </div>
                            </div>
                            <div class="appt-actions">
                                <span class="appt-amount">{appt.formattedAmount}</span>
                                <span class={appt.statusClass}>{appt.Status__c}</span>
                                <lightning-button-menu
                                    alternative-text="Cambiar estado"
                                    icon-size="x-small"
                                    menu-alignment="right"
                                    onselect={handleStatusChange}
                                    data-id={appt.Id}>
                                    <lightning-menu-item value="Confirmada" label="Confirmar"></lightning-menu-item>
                                    <lightning-menu-item value="En Progreso" label="En progreso"></lightning-menu-item>
                                    <lightning-menu-item value="Completada" label="Completada"></lightning-menu-item>
                                    <lightning-menu-item value="No Asistió" label="No asistió"></lightning-menu-item>
                                    <lightning-menu-item value="Cancelada" label="Cancelar"></lightning-menu-item>
                                    <lightning-menu-divider></lightning-menu-divider>
                                    <lightning-menu-item value="Eliminar" label="Eliminar cita" icon-name="utility:delete" class="menu-delete"></lightning-menu-item>
                                </lightning-button-menu>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <template lwc:else>
                <div class="ab-empty empty-state">
                    <div class="ab-empty__title">Agenda libre</div>
                    <p>{emptyMessage}</p>
                </div>
            </template>
        </section>

        <!-- Editar cita -->
        <c-salon-appointment-edit-modal lwc:ref="editModal" onsaved={handleEditSuccess} ondeleted={handleAppointmentDeleted}></c-salon-appointment-edit-modal>

        <!-- Bajo stock -->
        <template lwc:if={showLowStockModal}>
            <div class="ab-modal-overlay">
                <section class="ab-modal" role="dialog" aria-modal="true">
                    <div class="ab-modal__header">
                        <h2 class="ab-modal__title">Productos con bajo stock</h2>
                        <button class="ab-modal__close" onclick={closeLowStockModal} aria-label="Cerrar">&#215;</button>
                    </div>
                    <div class="ab-modal__body modal-body--list">
                        <template lwc:if={isLoadingLowStock}>
                            <div class="ab-loader-wrap"><div class="ab-loader" role="status" aria-label="Cargando"></div></div>
                        </template>
                        <template lwc:elseif={hasLowStockProducts}>
                            <ul class="modal-list">
                                <template for:each={lowStockProducts} for:item="prod">
                                    <li key={prod.Id} class="modal-list-item">
                                        <div class="modal-item-main">
                                            <span class="modal-item-name">{prod.Name}</span>
                                            <span class="modal-item-category">{prod.Category__c}</span>
                                        </div>
                                        <div class="modal-item-stock">
                                            <span class="stock-actual">{prod.Stock_Quantity__c}</span>
                                            <span class="stock-sep">/</span>
                                            <span class="stock-min">mín. {prod.Low_Stock_Alert__c}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <div class="ab-empty">No hay productos con bajo stock.</div>
                        </template>
                    </div>
                </section>
            </div>
        </template>

        <!-- Clientes inactivos -->
        <template lwc:if={showDormantModal}>
            <div class="ab-modal-overlay">
                <section class="ab-modal" role="dialog" aria-modal="true">
                    <div class="ab-modal__header">
                        <h2 class="ab-modal__title">Clientes inactivos</h2>
                        <button class="ab-modal__close" onclick={closeDormantModal} aria-label="Cerrar">&#215;</button>
                    </div>
                    <div class="ab-modal__body modal-body--list">
                        <template lwc:if={isLoadingDormant}>
                            <div class="ab-loader-wrap"><div class="ab-loader" role="status" aria-label="Cargando"></div></div>
                        </template>
                        <template lwc:elseif={hasDormantClients}>
                            <ul class="modal-list">
                                <template for:each={dormantClients} for:item="client">
                                    <li key={client.Id} class="modal-list-item">
                                        <div class="modal-item-main">
                                            <span class="modal-item-name">{client.Full_Name__c}</span>
                                            <span class="modal-item-category">{client.Phone__c}</span>
                                        </div>
                                        <div class="modal-item-date">
                                            <span class="date-label">Última visita</span>
                                            <span class="date-value">{client.lastVisitFormatted}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <div class="ab-empty">No hay clientes inactivos.</div>
                        </template>
                    </div>
                </section>
            </div>
        </template>

        <!-- Historial de balance -->
        <template lwc:if={showBalanceModal}>
            <div class="ab-modal-overlay">
                <section class="ab-modal ab-modal--balance" role="dialog" aria-modal="true">
                    <div class="ab-modal__header">
                        <h2 class="ab-modal__title">Balance · {balanceMonthLabel}</h2>
                        <button class="ab-modal__close" onclick={closeBalanceModal} aria-label="Cerrar">&#215;</button>
                    </div>
                    <div class="ab-modal__body">
                        <div class="balance-picker">
                            <lightning-combobox label="Mes" value={selectedMonthValue} options={monthOptions}
                                onchange={handleBalanceMonthChange} class="balance-picker__field"></lightning-combobox>
                            <lightning-combobox label="Año" value={selectedYearValue} options={yearOptions}
                                onchange={handleBalanceYearChange} class="balance-picker__field"></lightning-combobox>
                        </div>

                        <template lwc:if={isLoadingBalance}>
                            <div class="ab-loader-wrap"><div class="ab-loader" role="status" aria-label="Cargando"></div></div>
                        </template>
                        <template lwc:else>
                            <div class="balance-summary">
                                <div class="balance-card balance-card--income">
                                    <div class="ab-eyebrow">Ingresos</div>
                                    <div class="balance-card__value">{balanceIncome}</div>
                                </div>
                                <div class="balance-card balance-card--expense">
                                    <div class="ab-eyebrow">Gastos</div>
                                    <div class="balance-card__value">{balanceExpenses}</div>
                                </div>
                                <div class="balance-card balance-card--net">
                                    <div class="ab-eyebrow">Balance neto</div>
                                    <div class={balanceNetClass}>{balanceNet}</div>
                                </div>
                            </div>

                            <div class="balance-view-toggle" role="group" aria-label="Vista del balance">
                                <button class={balanceChartBtnClass} data-view="chart" onclick={handleBalanceViewToggle}
                                    aria-pressed={balanceChartPressed}>
                                    <lightning-icon icon-name="utility:chart" size="xx-small" class="toggle-icon"></lightning-icon>
                                    Gráfico
                                </button>
                                <button class={balanceListBtnClass} data-view="list" onclick={handleBalanceViewToggle}
                                    aria-pressed={balanceListPressed}>
                                    <lightning-icon icon-name="utility:list" size="xx-small" class="toggle-icon"></lightning-icon>
                                    Movimientos
                                </button>
                            </div>

                            <template lwc:if={isBalanceChartView}>
                                <c-salon-balance-chart income={chartIncome} expenses={chartExpenses}
                                    categories={chartCategories}></c-salon-balance-chart>
                            </template>
                            <template lwc:elseif={hasBalanceTransactions}>
                                <ul class="modal-list">
                                    <template for:each={balanceTransactions} for:item="tx">
                                        <li key={tx.Id} class="modal-list-item">
                                            <div class="tx-date">{tx.formattedDate}</div>
                                            <div class="modal-item-main">
                                                <span class="modal-item-name">{tx.Name}</span>
                                                <span class="modal-item-category">{tx.Category__c}</span>
                                            </div>
                                            <div class="tx-right">
                                                <template lwc:if={tx.isIngreso}>
                                                    <span class="tx-type-badge tx-type-badge--income">Ingreso</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="tx-type-badge tx-type-badge--expense">Gasto</span>
                                                </template>
                                                <span class="tx-amount">{tx.formattedAmount}</span>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <div class="ab-empty">No hay transacciones registradas para este mes.</div>
                            </template>
                        </template>
                    </div>
                </section>
            </div>
        </template>

    </div>
</template>
