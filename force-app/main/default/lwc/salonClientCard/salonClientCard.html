<template>
    <template lwc:if={isLoading}>
        <div class="ab-card ab-loader-wrap"><div class="ab-loader" role="status" aria-label="Cargando"></div></div>
    </template>

    <template lwc:elseif={showCard}>
        <article class="ab-card client-card">

            <!-- Cabecera -->
            <header class="card-header">
                <div class="avatar" aria-hidden="true">{clientInitials}</div>
                <div class="header-info">
                    <h2 class="client-name">
                        {client.Full_Name__c}
                        <template lwc:if={client.VIP_Client__c}>
                            <span class="badge badge-vip" title="Cliente VIP">VIP</span>
                        </template>
                    </h2>
                    <template lwc:if={birthday}>
                        <div class="birthday">
                            <lightning-icon icon-name="utility:event" size="xx-small" class="header-icon"></lightning-icon>
                            Cumpleaños: {birthday.label}
                            <template lwc:if={birthday.soon}>
                                <span class="birthday-soon">{birthday.soon}</span>
                            </template>
                        </div>
                    </template>
                </div>
            </header>

            <!-- Contacto -->
            <section class="section contact">
                <template lwc:if={hasContact}>
                    <div class="contact-actions">
                        <template lwc:if={whatsappLink}>
                            <a class="contact-btn contact-btn--whatsapp" href={whatsappLink} target="_blank" rel="noopener noreferrer">
                                <lightning-icon icon-name="utility:chat" size="x-small" class="contact-icon"></lightning-icon>
                                WhatsApp
                            </a>
                        </template>
                        <template lwc:if={callLink}>
                            <a class="contact-btn contact-btn--call" href={callLink}>
                                <lightning-icon icon-name="utility:call" size="x-small" class="contact-icon"></lightning-icon>
                                {client.Phone__c}
                            </a>
                        </template>
                        <template lwc:if={emailLink}>
                            <a class="contact-btn contact-btn--email" href={emailLink}>
                                <lightning-icon icon-name="utility:email" size="x-small" class="contact-icon"></lightning-icon>
                                {client.Email__c}
                            </a>
                        </template>
                        <template lwc:if={instagram}>
                            <a class="contact-btn contact-btn--instagram" href={instagram.url} target="_blank" rel="noopener noreferrer">
                                <svg class="ig-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                                    <circle cx="12" cy="12" r="4.2"></circle>
                                    <circle cx="17.3" cy="6.7" r="1.1" class="ig-dot"></circle>
                                </svg>
                                {instagram.handle}
                            </a>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="hint">Sin datos de contacto. Agregá teléfono, email o Instagram con «Editar».</p>
                </template>
            </section>

            <!-- Ficha de salud -->
            <section class="section">
                <h3 class="ab-eyebrow section-title">Ficha de salud</h3>
                <template lwc:if={hasHealthInfo}>
                    <template lwc:if={client.Allergies_Notes__c}>
                        <div class="allergy-alert" role="alert">
                            <lightning-icon icon-name="utility:warning" size="x-small" class="alert-icon"></lightning-icon>
                            <div>
                                <strong>Alergias / notas de seguridad</strong>
                                <p class="preline">{client.Allergies_Notes__c}</p>
                            </div>
                        </div>
                    </template>
                    <div class="health-row">
                        <span class="health-label">Enfermedades</span>
                        <div class="tag-list">
                            <template for:each={medicalConditions} for:item="condition">
                                <span key={condition} class="condition-tag">{condition}</span>
                            </template>
                            <template lwc:if={declaredNoConditions}>
                                <span class="health-none">Ninguna declarada</span>
                            </template>
                        </div>
                    </div>
                    <template lwc:if={client.Treatment_Protocol__c}>
                        <div class="health-row health-row--block">
                            <span class="health-label">Seguimiento del tratamiento</span>
                            <p class="treatment preline">{client.Treatment_Protocol__c}</p>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <p class="hint">Sin datos de salud registrados.</p>
                </template>
            </section>

            <!-- Estadísticas -->
            <section class="stats">
                <div class="stat">
                    <div class="stat-value">{totalVisits}</div>
                    <div class="ab-eyebrow">Visitas</div>
                </div>
                <div class="stat">
                    <div class="stat-value stat-value--money">{formattedTotalSpent}</div>
                    <div class="ab-eyebrow">Total gastado</div>
                </div>
                <div class="stat">
                    <div class="stat-value">{formattedLastVisit}</div>
                    <div class="ab-eyebrow">Última visita</div>
                </div>
            </section>

            <template lwc:if={hasPreferredServices}>
                <section class="section">
                    <h3 class="ab-eyebrow section-title">Servicios preferidos</h3>
                    <div class="tag-list">
                        <template for:each={preferredServices} for:item="service">
                            <span key={service} class="service-tag">{service}</span>
                        </template>
                    </div>
                </section>
            </template>

            <!-- Historial reciente -->
            <section class="section">
                <div class="section-header">
                    <h3 class="ab-eyebrow section-title">Últimas citas</h3>
                    <button class="link-btn view-history" onclick={handleViewHistory}>Ver historial completo ›</button>
                </div>
                <template lwc:if={isLoadingAppointments}>
                    <div class="ab-loader-wrap"><div class="ab-loader ab-loader--sm" role="status" aria-label="Cargando citas"></div></div>
                </template>
                <template lwc:elseif={hasRecentAppointments}>
                    <ul class="history-list">
                        <template for:each={recentAppointments} for:item="appt">
                            <li key={appt.Id} class="history-item">
                                <span class="history-date">{appt.formattedDate}</span>
                                <span class="history-services">
                                    <template for:each={appt.services} for:item="service">
                                        <span key={service} class="service-tag">{service}</span>
                                    </template>
                                </span>
                                <span class={appt.statusClass}>{appt.Status__c}</span>
                                <span class="history-amount">{appt.formattedAmount}</span>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="hint">Sin citas registradas aún.</p>
                </template>
            </section>
        </article>
    </template>

    <template lwc:else>
        <div class="ab-card ab-empty">No se pudo cargar la información de la clienta.</div>
    </template>
</template>
